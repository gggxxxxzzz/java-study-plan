<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>后端就业学习路线 · 每日计划</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wallpaper" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
  <span class="grain"></span>
</div>

<header class="topbar glass">
  <div class="brand">
    <div class="brand-text">
      <strong id="brandTitle">后端就业学习路线</strong>
      <span id="brandSub">主线 阶段 1→9 · 162 天 · 每天 8 小时</span>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab glass is-active" data-view="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 4.5 9.4V20a1 1 0 0 0 1 1h4.3v-6.1h4.4V21h4.3a1 1 0 0 0 1-1V9.4Z"/></svg>
      今天
    </button>
    <button class="tab glass" data-view="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2.8v2.4M17 2.8v2.4M3.6 9.2h16.8M5.4 4.8h13.2a1.8 1.8 0 0 1 1.8 1.8v13a1.8 1.8 0 0 1-1.8 1.8H5.4a1.8 1.8 0 0 1-1.8-1.8v-13a1.8 1.8 0 0 1 1.8-1.8Z"/></svg>
      日历
    </button>
    <button class="tab glass" data-view="diary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 3.6h9.1l3.9 3.9v12.9H6.2a1.8 1.8 0 0 1-1.8-1.8V5.4a1.8 1.8 0 0 1 1.8-1.8Z"/><path d="M8.2 9.6h5.4M8.2 13h7.6M8.2 16.4h4.6"/></svg>
      日记
    </button>
  </nav>

  <div class="clock">
    <span class="clock-time" id="clockTime">--:--:--</span>
    <span class="clock-date" id="clockDate">—</span>
  </div>
</header>

<main id="main">

  <!-- 今天 -->
  <section class="view is-active" id="view-today">
    <div class="today-grid">

      <article class="card hero">
        <div class="hero-top">
          <div>
            <p class="eyebrow" id="todayEyebrow">今天</p>
            <h1 class="hero-title" id="todayTopic">—</h1>
            <p class="hero-focus" id="todayFocus">—</p>
          </div>
          <div class="ring" id="todayRing">
            <svg viewBox="0 0 92 92" aria-hidden="true">
              <circle class="ring-bg" cx="46" cy="46" r="38"></circle>
              <circle class="ring-fg" cx="46" cy="46" r="38"></circle>
            </svg>
            <span class="ring-num" id="todayRingNum">0%</span>
          </div>
        </div>

        <div class="hero-meta">
          <span class="pill stage" id="pillStage">阶段 1 · 语言基础</span>
          <span class="pill" id="pillDay">第 1 / 372 天</span>
          <span class="pill" id="pillCount">0 / 0 项</span>
          <span class="pill" id="pillTime">约 0 分钟</span>
        </div>

        <ul class="task-list" id="todayTasks"></ul>

        <p class="tip" id="todayTip"></p>

      </article>

      <aside class="side">
        <article class="card mini-cal">
          <header class="card-head">
            <h2>日历</h2>
            <button class="icon-btn glass" id="miniPrev" title="上个月" aria-label="上个月">‹</button>
            <span class="mini-cal-month" id="miniMonth">—</span>
            <button class="icon-btn glass" id="miniNext" title="下个月" aria-label="下个月">›</button>
          </header>
          <div class="mini-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="mini-grid" id="miniGrid"></div>
          <button class="btn glass wide" id="goCalendar">打开完整日历</button>
        </article>

        <article class="card diary-mini">
          <header class="card-head">
            <h2>今日日记</h2>
            <span class="saved-dot" id="miniSaved">自动保存</span>
          </header>
          <textarea id="todayDiary" class="diary-input" rows="6" placeholder="今天学了什么、卡在哪、想通了什么，随手记两句。"></textarea>
          <div class="diary-foot">
            <span id="todayDiaryCount">0 字</span>
            <button class="btn glass" id="openDiary">展开写</button>
          </div>
        </article>
      </aside>
    </div>
  </section>

  <!-- 日历 -->
  <section class="view" id="view-calendar">
    <div class="cal-grid">
      <article class="card cal-card">
        <header class="cal-head">
          <button class="icon-btn glass" id="calPrev" aria-label="上个月">‹</button>
          <h2 id="calMonth">—</h2>
          <button class="icon-btn glass" id="calNext" aria-label="下个月">›</button>
          <button class="btn glass" id="calToday">回到今天</button>
        </header>
        <div class="cal-week">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal-days" id="calDays"></div>
        <div class="cal-legend">
          <span><i class="dot done"></i>全部完成</span>
          <span><i class="dot part"></i>进行中</span>
          <span><i class="dot plan"></i>有计划</span>
          <span><i class="dot rest"></i>自由安排</span>
        </div>
      </article>

      <article class="card cal-detail" id="calDetail">
        <p class="empty">点左边任意一天，这里显示当天要做什么。</p>
      </article>
    </div>
  </section>

  <!-- 日记 -->
  <section class="view" id="view-diary">
    <div class="diary-grid">
      <article class="card diary-main">
        <header class="card-head">
          <h2 id="diaryTitle">日记</h2>
          <div class="head-actions">
            <button class="btn glass" id="diaryToday">今天</button>
            <button class="btn glass" id="diaryExport">导出全部</button>
          </div>
        </header>
        <input type="date" id="diaryDate" class="date-input">
        <textarea id="diaryBig" class="diary-input big" placeholder="今天学了什么、哪里卡住了、明天先做什么。"></textarea>
        <div class="diary-foot">
          <span id="diaryCount">0 字</span>
          <span class="saved-dot" id="diarySaved">自动保存</span>
        </div>
      </article>

      <article class="card diary-list">
        <header class="card-head"><h2>写过的日子</h2><span class="pill" id="diaryTotal">0 篇</span></header>
        <ul id="diaryEntries"></ul>
      </article>
    </div>
  </section>

</main>

<footer class="dock glass" id="dock">
  <span class="dock-label">今日链接</span>
  <div class="dock-links" id="dockLinks"></div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="plan.js"></script>
  <script src="hyalite.js"></script>
<script src="app.js"></script>
</body>
</html>
